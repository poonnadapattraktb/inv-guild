<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>INV Guild CSM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#0a0818;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
a{color:#f2b73d;text-decoration:none;}a:hover{color:#ffd97a;}
::-webkit-scrollbar{width:0}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shine{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}

.btn{cursor:pointer;transition:transform .08s,filter .12s,background-color .12s;}
.btn-primary:hover{transform:translateY(-2px)}
.btn-primary:active{transform:translateY(4px);box-shadow:0 2px 0 #05030f !important}
.btn-secondary:hover{background:#2f2568}
.list-item:hover{background:#261e57}
.list-item:active{transform:translateY(2px);box-shadow:0 2px 0 #05030f !important}
.option-btn:hover{background:#2f2568}
.option-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #05030f !important}
.reroll-btn:hover{background:var(--accent);color:#211736}
.codex-link:hover{border-color:var(--accent) !important}
.home-btn:hover{filter:brightness(1.15)}
.home-btn:active{transform:translateY(2px)}
.avatar-pick:hover{filter:brightness(1.08)}

#app{position:relative}
</style>
</head>
<body>
<div id="app">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0818;font-family:'Press Start 2P',monospace;font-size:10px;color:#4b418a;letter-spacing:1px;">LOADING...</div>
</div>

<script src="config.js"></script>
<script>
/* ---------- pixel-art data (loaded from /data/*.json) ---------- */
let HAIRS, BODY, AVATARS, S, SLAB, SCOL, CLASSES, QS, OMENS, ROLLS, MEMBERS;

const ACCENT = "#3fd0c9";

function shadowFor(av) {
  const map = { h: av.h, s: av.s, c: av.c, a: av.a, e: "#1a1030", m: "#b2554d" };
  const rows = HAIRS[av.hair].concat(BODY);
  const out = [];
  for (let y = 0; y < rows.length; y++) {
    const r = rows[y];
    for (let x = 0; x < r.length; x++) {
      const col = map[r[x]];
      if (col) out.push((x * 6) + "px " + (y * 6) + "px 0 " + col);
    }
  }
  return out.join(",");
}
const SHADOWS = {};

function pick(arr, n) {
  const c = arr.slice();
  const out = [];
  while (out.length < n && c.length) out.push(c.splice(Math.floor(Math.random() * c.length), 1)[0]);
  return out;
}
function byId(list, id) { return list.filter(x => x.id === id)[0]; }
function esc(str) {
  return String(str).replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
}

function xorDecode(base64, key) {
  const bytes = atob(base64);
  let out = "";
  for (let i = 0; i < bytes.length; i++) {
    out += String.fromCharCode(bytes.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return out;
}

const Api = {
  config: window.INV_GUILD_CONFIG || {},

  get decodeKey() {
    return new URLSearchParams(location.search).get("ac") || "";
  },

  get supabaseKey() {
    if (this.config.supabasePublishableKey) return this.config.supabasePublishableKey;
    const encoded = this.config.supabasePublishableKeyEncoded;
    const key = this.decodeKey;
    if (!encoded || !key) return "";
    try { return xorDecode(encoded, key); } catch (e) { return ""; }
  },

  get ready() { return Boolean(this.config.supabaseUrl && this.supabaseKey); },

  get restUrl() { return this.config.supabaseUrl.replace(/\/$/, "") + "/rest/v1"; },

  headers(extra) {
    return Object.assign({
      apikey: this.supabaseKey,
      Authorization: "Bearer " + this.supabaseKey
    }, extra || {});
  },

  async errorFrom(response) {
    const detail = await response.json().catch(() => ({}));
    return new Error(detail.message || "Supabase request failed (" + response.status + ")");
  },

  normalize(member) {
    return {
      id: member.id,
      n: member.name,
      nick: member.nickname,
      r: member.role,
      c: member.class_id,
      av: member.avatar_id,
      pi: member.profile_img,
      lv: member.level,
      joinedAt: member.joined_at
    };
  },

  async getMember(id) {
    const response = await fetch(this.restUrl + "/members?id=eq." + encodeURIComponent(id), {
      headers: this.headers({ Accept: "application/vnd.pgrst.object+json" })
    });
    if (response.status === 406) return null;
    if (!response.ok) throw await this.errorFrom(response);
    return this.normalize(await response.json());
  },

  async listMembers() {
    const response = await fetch(this.restUrl + "/members?class_id=not.is.null&order=name.asc", {
      headers: this.headers()
    });
    if (!response.ok) throw await this.errorFrom(response);
    const rows = await response.json();
    return rows.map(row => this.normalize(row));
  },

  async assignMember(id, classId, avatarId, nickname, joinedAt) {
    const response = await fetch(this.restUrl + "/members?id=eq." + encodeURIComponent(id), {
      method: "PATCH",
      headers: this.headers({
        "Content-Type": "application/json",
        Prefer: "return=representation"
      }),
      body: JSON.stringify({
        class_id: classId,
        avatar_id: avatarId,
        assigned_at: new Date().toISOString(),
        nickname: (nickname || "").trim() || null,
        joined_at: joinedAt || null
      })
    });
    if (!response.ok) throw await this.errorFrom(response);
    const rows = await response.json();
    if (!rows[0]) throw new Error("ไม่พบสมาชิกสำหรับลิงก์นี้ หรือสมาชิกเลือกอาชีพไปแล้ว");
    return this.normalize(rows[0]);
  }
};

/* pixel avatar block: 84x84 base grid, optional scale for thumbnails */
function pixelAvatar(shadow, scale) {
  scale = scale || 1;
  const style = scale === 1
    ? "position:relative;width:84px;height:84px;"
    : "position:relative;width:84px;height:84px;transform:scale(" + scale + ");transform-origin:top left;";
  return '<div style="' + style + '"><div style="position:absolute;top:0;left:0;width:6px;height:6px;box-shadow:' + shadow + ';"></div></div>';
}

function calculateLevel(joinedYear) {
  const years = Math.max(0, new Date().getFullYear() - joinedYear);
  return 70 + Math.min(29, years * 4);
}

function normalizeJoinYear(raw) {
  const n = Number(String(raw ?? "").trim());
  if (!raw || !Number.isInteger(n)) return { error: "กรุณากรอกปีเป็นตัวเลข" };
  const ceYear = n > 2400 ? n - 543 : n;
  const current = new Date().getFullYear();
  if (ceYear > current) return { error: "ปีเข้าทำงานต้องไม่เป็นอนาคต" };
  if (ceYear < current - 60) return { error: "ปีเข้าทำงานเก่าเกินไป กรุณาตรวจสอบอีกครั้ง" };
  return { year: ceYear };
}

function effectiveLevel(member) {
  return member.joinedAt ? calculateLevel(member.joinedAt) : member.lv;
}

/* ---------- app state + logic ---------- */
const App = {
  state: {
    screen: "loading",
    mode: "guest",
    memberId: null,
    currentMember: null,
    avatarId: "a1",
    name: "",
    nickname: "",
    joinedAt: null,
    joinYearInput: "",
    joinYearError: null,
    qi: 0,
    answers: [],
    resultId: null,
    prev: null,
    quizId: null,
    bestScore: 0,
    luck: null,
    filter: "all",
    error: null,
    rosterError: null
  },

  set(patch) { Object.assign(this.state, patch); this.render(); },

  rollLuck() {
    const labels = pick(ROLLS, 4);
    return {
      die: Math.floor(Math.random() * 6) + 1,
      omen: pick(OMENS, 1)[0],
      rolls: labels.map(l => { const v = Math.floor(Math.random() * 100); return { label: l, pct: v + "%", good: v >= 55 }; })
    };
  },

  goWelcome() { this.set({ screen: "welcome" }); },
  goAvatar() {
    if (this.state.mode === "guest" || !this.state.currentMember || !this.state.currentMember.c) {
      this.set({ screen: "avatar" });
    }
  },
  goHomePrimary() {
    const member = this.state.currentMember;
    if (this.state.mode === "member" && member && member.c) {
      this.set({ screen: "memberProfile", resultId: member.c, avatarId: member.av, luck: this.state.luck || this.rollLuck() });
    } else {
      this.goAvatar();
    }
  },
  playAsGuest() {
    this.set({
      screen: "avatar",
      mode: "guest",
      memberId: null,
      currentMember: null,
      avatarId: "a1",
      name: "",
      nickname: "",
      joinedAt: null,
      joinYearInput: "",
      joinYearError: null,
      qi: 0,
      answers: [],
      resultId: null,
      prev: null,
      quizId: null,
      bestScore: 0,
      luck: null,
      error: null
    });
  },
  goCodex() { this.set({ screen: "codex", prev: this.state.screen }); },
  codexBack() { this.set({ screen: this.state.prev || "welcome" }); },
  goRoster() { this.set({ screen: "roster", prev: this.state.screen }); },
  rosterBack() { this.set({ screen: this.state.prev || "welcome" }); },
  startQuiz() { this.set({ screen: "quiz", qi: 0, answers: [] }); },
  restart() { if (this.state.mode === "guest") this.set({ screen: "avatar", qi: 0, answers: [], resultId: null }); },
  prevQ() { this.state.qi === 0 ? this.set({ screen: "avatar" }) : this.set({ qi: this.state.qi - 1 }); },
  rerollLuck() { this.set({ luck: this.rollLuck() }); },
  setName(v) { this.state.name = v; },
  setNickname(v) { this.state.nickname = v; },
  pickAvatar(id) { this.set({ avatarId: id }); },
  setFilter(id) { this.set({ filter: id }); },

  async answer(qi, optIdx) {
    const w = QS[qi].options[optIdx].scores;
    const answers = this.state.answers.slice();
    answers[qi] = w;
    if (qi >= QS.length - 1) {
      const score = {};
      answers.forEach(a => { if (!a) return; Object.keys(a).forEach(k => score[k] = (score[k] || 0) + a[k]); });
      let best = CLASSES[0].id, bv = -1;
      CLASSES.forEach(c => { if ((score[c.id] || 0) > bv) { bv = score[c.id] || 0; best = c.id; } });
      this.set({ answers, resultId: best, quizId: best, bestScore: bv, screen: "joinYear", joinYearInput: "", joinYearError: null });
    } else {
      this.set({ answers, qi: qi + 1 });
    }
  },

  setJoinYearInput(v) { this.set({ joinYearInput: v, joinYearError: null }); },

  async confirmJoinYear() {
    const parsed = normalizeJoinYear(this.state.joinYearInput);
    if (parsed.error) { this.set({ joinYearError: parsed.error }); return; }

    const result = { joinedAt: parsed.year, luck: this.rollLuck() };
    if (this.state.mode === "guest") {
      this.set(Object.assign(result, { screen: "quizResult" }));
      return;
    }

    Object.assign(this.state, result);
    await this.saveAssignment(this.state.resultId);
  },

  openClass(id) {
    const prev = this.state.screen === "classDetail" ? "codex" : this.state.screen;
    this.set({ resultId: id, screen: "classDetail", prev, luck: this.rollLuck() });
  },

  openMember(id) {
    const member = MEMBERS.find(item => item.id === id);
    if (member) this.set({ currentMember: member, resultId: member.c, avatarId: member.av, screen: "memberProfile", prev: "roster" });
  },

  resultBack() {
    const st = this.state;
    if (st.screen === "classDetail") this.set({ screen: st.prev || "codex" });
    else if (st.screen === "memberProfile" && st.prev === "roster") this.set({ screen: "roster" });
  },

  retrySave() {
    if (this.state.resultId) this.saveAssignment(this.state.resultId);
  },

  async saveAssignment(classId) {
    this.set({ screen: "saving", error: null });
    try {
      const member = await Api.assignMember(this.state.memberId, classId, this.state.avatarId, this.state.nickname, this.state.joinedAt);
      const existingIndex = MEMBERS.findIndex(item => item.id === member.id);
      if (existingIndex >= 0) MEMBERS[existingIndex] = member;
      else MEMBERS.push(member);
      this.set({ currentMember: member, resultId: member.c, avatarId: member.av, screen: "memberProfile" });
    } catch (error) {
      this.set({ screen: "saveError", error: error.message });
    }
  },

  /* ---------- rendering ---------- */
  render() {
    const st = this.state;
    const heroLevel = st.screen === "memberProfile" && st.currentMember
      ? effectiveLevel(st.currentMember)
      : (st.screen === "classDetail" ? 10 : (st.joinedAt ? calculateLevel(st.joinedAt) : Math.min(30, 6 + Math.round((st.bestScore || 6) * 1.4))));
    const resultScreens = ["quizResult", "memberProfile", "classDetail"];
    const hudRight = st.screen === "quiz" ? ("Q" + (st.qi + 1) + "/" + QS.length) : (resultScreens.includes(st.screen) ? ("LV." + heroLevel) : "LV.1");
    const homeBg = st.screen === "welcome" ? "#181236" : "#241c52";
    const homeFg = st.screen === "welcome" ? "#4b418a" : ACCENT;

    let body = "";
    if (st.screen === "welcome") body = this.renderWelcome();
    else if (st.screen === "avatar") body = this.renderAvatar();
    else if (st.screen === "quiz") body = this.renderQuiz();
    else if (st.screen === "joinYear") body = this.renderJoinYear();
    else if (st.screen === "quizResult") body = this.renderQuizResult(heroLevel);
    else if (st.screen === "memberProfile") body = this.renderMemberProfile(heroLevel);
    else if (st.screen === "classDetail") body = this.renderClassDetail(heroLevel);
    else if (st.screen === "codex") body = this.renderCodex();
    else if (st.screen === "roster") body = this.renderRoster();
    else if (st.screen === "saving") body = this.renderStatus("SAVING...", "กำลังบันทึกอาชีพของคุณ");
    else if (st.screen === "saveError") body = this.renderStatus("SAVE FAILED", st.error, true);
    else if (st.screen === "error") body = this.renderStatus("LINK ERROR", st.error);

    const html = `
<div style="position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:0;background:#0a0818;background-image:radial-gradient(circle at 20% 15%,#241a4a 0%,rgba(10,8,24,0) 55%),radial-gradient(circle at 82% 78%,#0f3b52 0%,rgba(10,8,24,0) 50%),linear-gradient(#0a0818,#0a0818);font-family:Kanit,system-ui,sans-serif;">
  <div style="position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px;"></div>

  <div style="--accent:${ACCENT};position:relative;width:min(414px,100vw);height:min(880px,100vh);flex:none;background:#151033;border:5px solid #05030f;box-shadow:0 0 0 5px #2b2159,0 24px 60px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow:hidden;">

    <div style="position:absolute;inset:0;z-index:60;pointer-events:none;opacity:.35;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0px,rgba(0,0,0,.28) 1px,transparent 1px,transparent 3px);"></div>

    <div style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#0d0a22;border-bottom:4px solid #05030f;">
      <div style="display:flex;align-items:center;gap:7px;">
        <div style="width:14px;height:14px;background:${ACCENT};box-shadow:4px 0 0 #05030f,-4px 0 0 #05030f;"></div>
        <span style="font-family:'Press Start 2P',monospace;font-size:8px;color:#f4ecd8;letter-spacing:.5px;">INV GUILD</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-family:'Press Start 2P',monospace;font-size:8px;color:#e0508f;">♥♥♥</span>
        <span style="font-family:'Press Start 2P',monospace;font-size:8px;color:#3fd0c9;">${hudRight}</span>
      </div>
    </div>

    <div style="flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;">
      ${body}
    </div>

    <div style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:#0d0a22;border-top:4px solid #05030f;">
      <div class="btn home-btn" onclick="App.goWelcome()" style="cursor:pointer;flex:none;display:flex;align-items:center;gap:7px;padding:7px 11px;background:${homeBg};border:3px solid #05030f;">
        <div style="width:12px;height:12px;background:${homeFg};clip-path:polygon(50% 0,100% 45%,84% 45%,84% 100%,60% 100%,60% 62%,40% 62%,40% 100%,16% 100%,16% 45%,0 45%);"></div>
        <span style="font-family:'Press Start 2P',monospace;font-size:8px;color:${homeFg};">HOME</span>
      </div>
      <div style="font-family:'Press Start 2P',monospace;font-size:7px;color:#4b418a;">CSM CHAPTER · v1.0</div>
    </div>
  </div>
</div>`;

    document.getElementById("app").innerHTML = html;
  },

  renderWelcome() {
    const memberHasClass = this.state.mode === "member" && this.state.currentMember && this.state.currentMember.c;
    const primaryLabel = memberHasClass ? "ดูข้อมูลของท่าน" : "เลือกอาชีพ";
    const guestButton = this.state.mode === "member"
      ? '<div class="btn btn-secondary" onclick="App.playAsGuest()" style="cursor:pointer;position:absolute;top:14px;right:14px;padding:7px 9px;background:#241c52;border:3px solid #05030f;box-shadow:0 3px 0 #05030f;font-family:\'Press Start 2P\',monospace;font-size:7px;color:#cfc6f5;">GUEST MODE</div>'
      : "";
    return `
<div style="position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:34px 22px 40px;text-align:center;">
  ${guestButton}
  <div style="font-family:'Press Start 2P',monospace;font-size:9px;color:#8b7ed8;letter-spacing:2px;margin-bottom:18px;">◆ CHAPTER 01 ◆</div>
  <div style="position:relative;padding:20px 18px;background:#1e1746;border:4px solid #05030f;box-shadow:inset 0 0 0 3px #35296e,8px 8px 0 rgba(0,0,0,.45);overflow:hidden;">
    <div style="position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);animation:shine 3.4s linear infinite;"></div>
    <div style="font-family:'Press Start 2P',monospace;font-size:26px;line-height:1.35;color:#f4ecd8;text-shadow:4px 4px 0 #05030f,0 0 22px rgba(242,183,61,.35);">INV<br>GUILD</div>
    <div style="margin-top:12px;display:inline-block;padding:5px 10px;background:${ACCENT};border:3px solid #05030f;font-family:'Press Start 2P',monospace;font-size:10px;color:#211736;">CSM</div>
  </div>
  <div style="margin-top:22px;font-size:15px;font-weight:500;color:#cfc6f5;line-height:1.7;">ยินดีต้อนรับสู่กิลด์นักผจญภัย INVESTMENT<br><span style="color:#8b7ed8;font-size:13px;">ตอบ 8 คำถาม แล้วมารับ “อาชีพ” ประจำตัวของคุณ</span></div>

  <div style="margin-top:24px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;">
    <div class="btn btn-primary" onclick="App.goHomePrimary()" style="cursor:pointer;padding:15px 12px;background:${ACCENT};border:4px solid #05030f;box-shadow:0 6px 0 #05030f;font-family:Kanit,sans-serif;font-weight:700;font-size:16px;color:#211736;text-align:center;">${primaryLabel}</div>
    <div class="btn btn-secondary" onclick="App.goCodex()" style="cursor:pointer;padding:12px;background:#241c52;border:4px solid #05030f;box-shadow:0 5px 0 #05030f;font-family:Kanit,sans-serif;font-weight:600;font-size:14px;color:#cfc6f5;text-align:center;">ทำเนียบอาชีพทั้งหมด (${CLASSES.length})</div>
    <div class="btn btn-secondary" onclick="App.goRoster()" style="cursor:pointer;padding:12px;background:#241c52;border:4px solid #05030f;box-shadow:0 5px 0 #05030f;font-family:Kanit,sans-serif;font-weight:600;font-size:14px;color:#cfc6f5;text-align:center;">สมาชิกในกิลด์ (${MEMBERS.length})</div>
  </div>

  <div style="margin-top:26px;display:flex;gap:14px;align-items:center;">
    <div style="font-family:'Press Start 2P',monospace;font-size:7px;color:#6a5fae;">${QS.length} QUESTIONS</div>
    <div style="width:4px;height:4px;background:#6a5fae;"></div>
    <div style="font-family:'Press Start 2P',monospace;font-size:7px;color:#6a5fae;">${CLASSES.length} CLASSES</div>
    <div style="width:4px;height:4px;background:#6a5fae;"></div>
    <div style="font-family:'Press Start 2P',monospace;font-size:7px;color:#6a5fae;">${S.length} STATS</div>
  </div>
  <div style="margin-top:20px;font-family:'Press Start 2P',monospace;font-size:7px;color:#4b418a;animation:blink 1.2s steps(1) infinite;">- INTERNAL TEAM EVENT -</div>
</div>`;
  },

  renderAvatar() {
    const st = this.state;
    const profileImg = st.mode === "member" && st.currentMember && st.currentMember.pi;
    const avatarsHtml = AVATARS.map(a => {
      const border = a.id === st.avatarId ? ACCENT : "#05030f";
      const label = a.id === st.avatarId ? ACCENT : "#8b7ed8";
      return `
      <div class="btn avatar-pick" onclick="App.pickAvatar('${a.id}')" style="cursor:pointer;padding:8px 6px 9px;background:${a.bg};border:4px solid ${border};box-shadow:0 4px 0 #05030f;display:flex;flex-direction:column;align-items:center;gap:6px;">
        ${pixelAvatar(SHADOWS[a.id])}
        <div style="font-family:'Press Start 2P',monospace;font-size:7px;color:${label};">${a.name}</div>
      </div>`;
    }).join("");

    const pickerHtml = profileImg ? `

  renderCodex() {

    const averageLevel = MEMBERS.length ? Math.round(MEMBERS.reduce((total, member) => total + effectiveLevel(member), 0) / MEMBERS.length) : 0;
    const rosterStats = [
      { n: MEMBERS.length, label: "สมาชิกทั้งหมด", color: ACCENT },
      { n: new Set(MEMBERS.map(m => m.c)).size, label: "สายอาชีพที่มี", color: "#3fd0c9" },
      { n: averageLevel, label: "เลเวลเฉลี่ย", color: "#e0508f" }
    ];
    const statsHtml = rosterStats.map(rs => `
      <div style="padding:9px 8px;background:#1e1746;border:4px solid #05030f;text-align:center;">
        <div style="font-family:'Press Start 2P',monospace;font-size:14px;color:${rs.color};">${rs.n}</div>
        <div style="margin-top:5px;font-size:11.5px;color:#8b7ed8;line-height:1.3;">${rs.label}</div>
      </div>`).join("");

    const filters = [{ id: "all", label: "ทั้งหมด" }].concat(
      CLASSES.filter(c => MEMBERS.some(m => m.c === c.id)).map(c => ({ id: c.id, label: c.short }))
    );
    const filtersHtml = filters.map(f => {
      const on = st.filter === f.id;
      const bg = on ? ACCENT : "#241c52";
      const fg = on ? "#211736" : "#9d92d6";
      return `<div class="btn" onclick="App.setFilter('${f.id}')" style="flex:none;cursor:pointer;padding:7px 10px;background:${bg};border:3px solid #05030f;font-family:Kanit,sans-serif;font-weight:600;font-size:12.5px;color:${fg};white-space:nowrap;">${f.label}</div>`;
    }).join("");

    const members = MEMBERS.filter(m => st.filter === "all" || m.c === st.filter);
    const membersHtml = members.map(m => {
      const c = byId(CLASSES, m.c);
      const a = byId(AVATARS, m.av);
      return `
      <div class="btn list-item" onclick="App.openMember('${m.id}')" style="cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 11px;background:#1e1746;border:4px solid #05030f;box-shadow:0 4px 0 #05030f;">
        <div style="flex:none;width:46px;height:46px;padding:2px;background:${a.bg};border:3px solid #05030f;overflow:hidden;">
          ${pixelAvatar(SHADOWS[m.av], 0.5)}
        </div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:baseline;gap:7px;">
            <span style="font-size:15px;font-weight:600;color:#f4ecd8;">${m.n}</span>
            <span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#6a5fae;">LV.${effectiveLevel(m)}</span>
          </div>
          <div style="margin-top:4px;font-size:12.5px;color:#9d92d6;">${m.r}</div>
        </div>
        <div style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
          <div style="padding:3px 7px;background:${c.color};font-family:'Press Start 2P',monospace;font-size:8px;color:#0d0a22;">${c.short}</div>
          <div style="font-family:'Press Start 2P',monospace;font-size:7px;color:${c.color};">${c.en}</div>
        </div>
      </div>`;
    }).join("");
    const rosterNotice = st.rosterError
      ? `<div style="margin-top:12px;padding:12px;background:#3d1526;border:3px solid #ff8fa3;font-size:13px;line-height:1.5;color:#ffd6de;">โหลดรายชื่อไม่สำเร็จ: ${esc(st.rosterError)}</div>`
      : (!Api.ready ? `<div style="margin-top:12px;padding:12px;background:#241c52;border:3px solid #6a5fae;font-size:13px;line-height:1.5;color:#cfc6f5;">ยังไม่ได้ตั้งค่า Supabase จึงไม่สามารถแสดงรายชื่อสมาชิกได้</div>` : "");

    return `
<div style="padding:18px 18px 34px;">
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="font-family:'Press Start 2P',monospace;font-size:11px;color:#f4ecd8;text-shadow:3px 3px 0 #05030f;">GUILD ROSTER</div>
    <div class="btn" onclick="App.rosterBack()" style="cursor:pointer;font-family:Kanit,sans-serif;font-weight:600;font-size:13px;color:#8b7ed8;">◀ กลับ</div>
  </div>
  <div style="margin-top:8px;font-size:13px;color:#8b7ed8;">สมาชิกกิลด์ INV · CSM Chapter — ชื่อและสายอาชีพประจำตัว</div>

  <div style="margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">${statsHtml}</div>

  <div style="margin-top:14px;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;">${filtersHtml}</div>

  ${rosterNotice}
  <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">${membersHtml}</div>

  <div style="margin-top:16px;padding:12px;background:#0d0a22;border:3px dashed #2b2159;text-align:center;">
    <div style="font-family:'Press Start 2P',monospace;font-size:8px;color:#4b418a;">EMPTY SLOT</div>
    <div style="margin-top:7px;font-size:12.5px;color:#6a5fae;">ยังมีที่ว่างในปาร์ตี้ — ชวนเพื่อนมาทำแบบทดสอบ</div>
  </div>
</div>`;
  },

  renderStatus(title, message, retry) {
    return `
<div style="min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;">
  <div style="font-family:'Press Start 2P',monospace;font-size:13px;color:${retry ? "#ff8fa3" : ACCENT};">${title}</div>
  <div style="margin-top:16px;font-size:14px;line-height:1.7;color:#cfc6f5;">${esc(message || "กรุณาลองอีกครั้ง")}</div>
  ${retry ? `<div class="btn btn-primary" onclick="App.retrySave()" style="margin-top:20px;padding:12px 18px;background:${ACCENT};border:4px solid #05030f;color:#211736;font-weight:700;">ลองบันทึกอีกครั้ง</div>` : ""}
</div>`;
  }
};

/* ---------- data loading ---------- */
async function loadData() {
  const [avatarsData, classesData, quizData, luckData] = await Promise.all(
    ["data/avatars.json", "data/classes.json", "data/quiz.json", "data/luck.json"]
      .map(url => fetch(url).then(r => {
        if (!r.ok) throw new Error("Failed to load " + url + " (" + r.status + ")");
        return r.json();
      }))
  );

  HAIRS = avatarsData.hairs;
  BODY = avatarsData.body;
  AVATARS = avatarsData.avatars;
  S = classesData.statKeys;
  SLAB = classesData.statLabels;
  SCOL = classesData.statColors;
  CLASSES = classesData.classes;
  QS = quizData.questions;
  OMENS = luckData.omens;
  ROLLS = luckData.rolls;
  MEMBERS = [];

  AVATARS.forEach(a => SHADOWS[a.id] = shadowFor(a));
  if (Api.ready) {
    try {
      MEMBERS = await Api.listMembers();
    } catch (error) {
      App.state.rosterError = error.message;
    }
  }

  const memberId = new URLSearchParams(location.search).get("id");
  if (!memberId) {
    Object.assign(App.state, { screen: "welcome", mode: "guest" });
  } else if (!/^[A-Za-z0-9_-]{8,21}$/.test(memberId)) {
    Object.assign(App.state, { screen: "error", error: "รูปแบบ ID ในลิงก์ไม่ถูกต้อง" });
  } else if (!Api.ready) {
    Object.assign(App.state, { screen: "error", error: "ยังไม่ได้ตั้งค่าการเชื่อมต่อ Supabase" });
  } else {
    const member = await Api.getMember(memberId);
    if (!member) {
      Object.assign(App.state, { screen: "error", error: "ไม่พบสมาชิกสำหรับลิงก์นี้" });
    } else if (member.c) {
      Object.assign(App.state, { screen: "welcome", mode: "member", memberId, currentMember: member, resultId: member.c, avatarId: member.av, name: member.n, nickname: member.nick || "", luck: App.rollLuck() });
    } else {
      Object.assign(App.state, { screen: "welcome", mode: "member", memberId, currentMember: member, avatarId: member.av || "a1", name: member.n, nickname: member.nick || "" });
    }
  }
  App.render();
}

loadData().catch(err => {
  console.error(err);
  document.getElementById("app").innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0a0818;font-family:Kanit,sans-serif;color:#ff8fa3;text-align:center;">โหลดข้อมูลไม่สำเร็จ — ต้องเปิดผ่านเว็บเซิร์ฟเวอร์ (เช่น <code>python3 -m http.server</code>) ไม่ใช่เปิดไฟล์ตรง ๆ<br><br>' + err.message + '</div>';
});
</script>
